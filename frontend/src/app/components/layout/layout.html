<div class="min-h-screen bg-slate-50">
  <nav class="bg-indigo-900">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-indigo-400 rounded-lg flex items-center justify-center">
          <span class="text-white font-bold text-sm">SM</span>
        </div>
        <span class="text-xl font-bold text-white">Salary Management</span>
      </div>
      <div class="flex gap-1">
        @for (item of navItems; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive
            [routerLinkActiveOptions]="{ exact: true }"
            #rla="routerLinkActive"
            class="px-4 py-2 rounded-lg text-sm font-medium transition-colors"
            [class]="rla.isActive ? 'bg-indigo-700 text-white' : 'text-indigo-200 hover:bg-indigo-800 hover:text-white'"
          >
            {{ item.label }}
          </a>
        }
      </div>
    </div>
  </nav>
  <main class="max-w-7xl mx-auto px-6 py-8">
    <ng-content />
  </main>
</div>
