spring.application.name=salary-management-backend
server.port=8000

# Database (override with the DATABASE_URL environment variable)
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:./salary.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# API docs
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/openapi.json
